name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Validate release tag and commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag $TAG must exactly match package.json version v$VERSION"
            exit 1
          fi
          git fetch origin main --quiet
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [[ -z "$TAG_SHA" ]]; then
            echo "::error::Could not resolve release tag $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Release tag $TAG is not on the main branch history"
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: MCP stdio runtime smoke test
        run: npm run test:runtime

      - name: Verify npm tarball
        run: npm run verify:package

      - name: Ensure version is not already published
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION already exists on npm; published versions are immutable"
            exit 1
          fi

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
