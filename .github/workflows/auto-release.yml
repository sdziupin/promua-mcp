name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether this main update may release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq 'length')"
          if [[ "$RELEASE_COUNT" == "0" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=bootstrap" >> "$GITHUB_OUTPUT"
            echo "No existing GitHub release: allowing one-time bootstrap release."
            exit 0
          fi

          PR_COUNT="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')"

          if [[ "$PR_COUNT" == "0" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=direct-push" >> "$GITHUB_OUTPUT"
            echo "::notice::No release: main commit is not associated with a merged PR."
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "reason=merged-pr" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.should_release == 'true'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: Install locked dependencies
        if: steps.gate.outputs.should_release == 'true'
        run: npm ci

      - name: Validate npm authentication
        if: steps.gate.outputs.should_release == 'true'
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions secret NPM is missing or empty"
            exit 1
          fi
          WHOAMI="$(npm whoami)"
          echo "whoami=$WHOAMI" >> "$GITHUB_OUTPUT"
          echo "Authenticated to npm as $WHOAMI"

      - name: Determine release version and validate package ownership
        if: steps.gate.outputs.should_release == 'true'
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          REPO_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view "$NAME" version 2>/dev/null || true)"

          if [[ -n "$PUBLISHED_VERSION" ]]; then
            PUBLISHED_REPO="$(npm view "$NAME" repository.url 2>/dev/null || true)"
            if [[ "$PUBLISHED_REPO" != *"github.com/sdziupin/promua-mcp"* ]]; then
              echo "::error::npm package $NAME already exists but its repository is not sdziupin/promua-mcp: $PUBLISHED_REPO"
              exit 1
            fi

            OWNERS="$(npm owner ls "$NAME" 2>/dev/null || true)"
            if [[ "$OWNERS" != *"${{ steps.npm-auth.outputs.whoami }}"* ]]; then
              echo "::error::Authenticated npm user is not listed as an owner of existing package $NAME"
              exit 1
            fi
          fi

          RELEASE_VERSION="$(node scripts/next-release-version.mjs "$REPO_VERSION" "$PUBLISHED_VERSION")"
          TAG="v$RELEASE_VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists"
            exit 1
          fi

          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $NAME@$RELEASE_VERSION ($TAG)"

      - name: Typecheck
        if: steps.gate.outputs.should_release == 'true'
        run: npm run check

      - name: Unit tests
        if: steps.gate.outputs.should_release == 'true'
        run: npm test

      - name: Build
        if: steps.gate.outputs.should_release == 'true'
        run: npm run build

      - name: MCP stdio runtime smoke test
        if: steps.gate.outputs.should_release == 'true'
        run: npm run test:runtime

      - name: Verify npm tarball
        if: steps.gate.outputs.should_release == 'true'
        run: npm run verify:package

      - name: Create release tag and GitHub Release
        if: steps.gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): $TAG"
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"
          git tag -a "$TAG" "$RELEASE_SHA" -m "$TAG"
          git push origin "refs/tags/$TAG"

          if ! gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes; then
            git push --delete origin "$TAG" || true
            exit 1
          fi

      - name: Publish npm package
        if: steps.gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! npm publish --access public --provenance; then
            gh release delete "$TAG" --yes --cleanup-tag || true
            exit 1
          fi

      - name: Sync released version back to devel when safe
        if: steps.gate.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin refs/heads/devel >/dev/null 2>&1; then
            echo "devel does not exist yet; skipping version sync."
            exit 0
          fi

          git fetch origin devel --quiet
          git switch -C devel origin/devel
          DEVEL_VERSION="$(node -p "require('./package.json').version")"
          CMP="$(node --input-type=module -e "import { compareVersions } from './scripts/next-release-version.mjs'; console.log(compareVersions(process.argv[1], process.argv[2]));" "$RELEASE_VERSION" "$DEVEL_VERSION")"

          if [[ "$CMP" -le 0 ]]; then
            echo "devel version $DEVEL_VERSION is already >= released $RELEASE_VERSION; skipping."
            exit 0
          fi

          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore: sync released version $RELEASE_VERSION"
          git push origin devel
